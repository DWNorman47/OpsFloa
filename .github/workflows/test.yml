name: Tests

on:
  push:
    branches: [main, stage, dev]
  pull_request:
    branches: [main, stage, dev]

permissions:
  contents: read

# CI runs exactly what `npm run verify` runs locally — server: eslint + jest; client:
# eslint + vitest (incl. i18n parity) + vite build — plus the CI-only gates that need
# services verify can't assume: migrations lint on a throwaway Postgres, and npm audit.
# Third-party actions are pinned to full commit SHAs (the tag is in the comment); bump
# both together.
jobs:
  server-verify:
    name: Server verify (ESLint + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (tag v4)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (tag v4)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm install
      # = npm run verify:server (eslint . && jest)
      - run: npm run verify
      # Fail the build on high/critical prod vulns. Moderate and below don't
      # block — fix at your cadence. --omit=dev ignores vulns in dev-only
      # packages (jest, nodemon, etc.) that can't affect production. A registry
      # outage (503/timeout) is retried and, if persistent, warned-and-skipped
      # so npmjs.org being down can't block a PR — only real vulns fail.
      - name: npm audit
        shell: bash
        run: |
          set +e
          LEVEL=high
          # --fetch-retries=0 + a short --fetch-timeout so each call fails FAST on a
          # registry outage (npm's default internal retries can hang for minutes).
          for i in 1 2; do
            OUT=$(npm audit --omit=dev --audit-level=$LEVEL --fetch-retries=0 --fetch-timeout=30000 2>&1); CODE=$?
            if [ $CODE -eq 0 ]; then echo "$OUT"; exit 0; fi
            if echo "$OUT" | grep -qiE '503|Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|ENETUNREACH|socket hang up|Too Many Requests'; then
              echo "npm audit registry error (attempt $i/2):"; echo "$OUT" | tail -3
              if [ $i -lt 2 ]; then sleep 10; continue; fi
              echo "::warning::npm audit registry unavailable — skipping (transient)."; exit 0
            fi
            echo "$OUT"; echo "::error::npm audit found ${LEVEL}+ vulnerabilities."; exit 1
          done

  migrations-lint:
    name: Migrations lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Throwaway Postgres that lives only for this job — never a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (tag v4)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (tag v4)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: npm run lint:migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          DATABASE_SSL: 'false'

  client-verify:
    name: Client verify (ESLint + Vitest + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (tag v4)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (tag v4)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm install
      # = npm run verify:client (eslint src && vitest run && vite build). The build
      # catches import / JSX errors the linter and unit tests miss.
      - run: npm run verify
      # Client has two known build-time advisories (esbuild, serialize-javascript
      # via vite-plugin-pwa) that require breaking Vite upgrades to clear.
      # Neither is reachable at runtime, so we only fail on *critical* here
      # until those are upgraded deliberately. A registry outage (503/timeout) is
      # retried and warned-and-skipped if persistent — only real vulns fail.
      - name: npm audit
        shell: bash
        run: |
          set +e
          LEVEL=critical
          # --fetch-retries=0 + a short --fetch-timeout so each call fails FAST on a
          # registry outage (npm's default internal retries can hang for minutes).
          for i in 1 2; do
            OUT=$(npm audit --omit=dev --audit-level=$LEVEL --fetch-retries=0 --fetch-timeout=30000 2>&1); CODE=$?
            if [ $CODE -eq 0 ]; then echo "$OUT"; exit 0; fi
            if echo "$OUT" | grep -qiE '503|Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|ENETUNREACH|socket hang up|Too Many Requests'; then
              echo "npm audit registry error (attempt $i/2):"; echo "$OUT" | tail -3
              if [ $i -lt 2 ]; then sleep 10; continue; fi
              echo "::warning::npm audit registry unavailable — skipping (transient)."; exit 0
            fi
            echo "$OUT"; echo "::error::npm audit found ${LEVEL}+ vulnerabilities."; exit 1
          done
