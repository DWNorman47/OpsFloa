name: Refresh Demo Operations

# Keeps the public demo company centered around the current date.
# This job only seeds the named fictional company. It does not run migrations
# or touch other companies.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      demo_seed_date:
        description: 'Optional YYYY-MM-DD date to center demo data around'
        required: false
        type: string

jobs:
  refresh:
    name: Seed Demo Operations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm install

      # Wipe whatever the public demo login uploaded to R2 in the last 24h
      # and reset the storage counter, so the 200 MB cap starts each day
      # fresh. R2_* secrets enable actual object deletion; without them the
      # script still clears DB references + the counter. Runs before the
      # re-seed so the baseline is clean.
      - name: Refresh configured demo databases
        shell: bash
        run: |
          set -euo pipefail

          refresh_one() {
            local label="$1"
            local database_url="$2"
            if [ -z "$database_url" ]; then
              echo "Skipping ${label}; no database URL secret configured."
              return
            fi

            echo "::group::Wipe demo storage (${label})"
            DATABASE_URL="$database_url" npm run wipe:demo-storage
            echo "::endgroup::"

            echo "::group::Refresh demo data (${label})"
            DATABASE_URL="$database_url" npm run seed:demo
            echo "::endgroup::"
          }

          if [ -z "${DEV_DATABASE_URL:-}" ] && [ -z "${STAGING_DATABASE_URL:-}" ] && [ -z "${PROD_DATABASE_URL:-}" ]; then
            echo "No DEV_DATABASE_URL, STAGING_DATABASE_URL, or PROD_DATABASE_URL secret is configured."
            exit 1
          fi

          refresh_one "dev" "${DEV_DATABASE_URL:-}"

          if [ "${GITHUB_REF_NAME:-}" = "stage" ] || [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            refresh_one "stage" "${STAGING_DATABASE_URL:-}"
          else
            echo "Skipping stage; this refresh is running from ${GITHUB_REF_NAME:-unknown}, not stage/main."
          fi

          if [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            refresh_one "prod" "${PROD_DATABASE_URL:-}"
          else
            echo "Skipping prod; this refresh is running from ${GITHUB_REF_NAME:-unknown}, not main."
          fi
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_SSL: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          DEMO_COMPANY_NAME: Demo Operations
          DEMO_ADMIN_USERNAME: Admin
          # Set the DEMO_ADMIN_PASSWORD repo secret to the (publishable) demo
          # login password. If unset, the seeder falls back to its built-in
          # default — so no real credential is hardcoded in this workflow.
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          DEMO_SEED_DATE: ${{ github.event.inputs.demo_seed_date || '' }}
