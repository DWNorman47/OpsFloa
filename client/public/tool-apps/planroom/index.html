<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Room</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
<script>
(() => {
  try {
    if (!localStorage.getItem('tc_token') && !sessionStorage.getItem('tc_token')) {
      window.location.replace('/login');
    }
  } catch (_) {
    window.location.replace('/login');
  }
})();
</script>
<script src="../shared/pdf.min.js"></script>
</head>
<body>
<header id="topbar">
  <div class="tb-group">
    <div class="brand">Plan&nbsp;Room</div>
    <button id="btnProjects" class="btn" title="Switch, create, or manage plan projects">📁 <span id="projName">Project</span></button>
  </div>

  <div class="tb-group">
    <button id="btnNew" class="btn" title="Start a fresh project">📄<span class="btn-label"> New</span></button>
    <button id="btnExport" class="btn" title="Download this project as one self-contained file — plans and markups embedded — so you can hand it to anyone">💾<span class="btn-label"> Save</span></button>
    <button id="btnImport" class="btn" title="Load a saved Plan Room file">📂<span class="btn-label"> Load</span></button>
    <input type="file" id="fileImport" accept="application/json" hidden>
    <button id="btnOpenDoc" class="btn primary" title="Open a plan set — PDF, or an image (aerial / photo of a sheet)">Open Plans…</button>
    <input type="file" id="fileDoc" accept="application/pdf,image/*" hidden>
  </div>

  <!-- markup tools -->
  <div class="tb-group tb-tools">
    <button class="tool active" data-tool="pan" title="Pan / zoom (middle-drag pans in any tool)">✋</button>
    <button class="tool" data-tool="select" title="Select / move / resize markups. Delete removes; double-click a note to edit it">➤</button>
    <button class="tool" data-tool="cloud" title="Revision cloud — drag a box">☁</button>
    <button class="tool" data-tool="rect" title="Rectangle — drag">▭</button>
    <button class="tool" data-tool="ellipse" title="Ellipse — drag">⬭</button>
    <button class="tool" data-tool="arrow" title="Arrow — drag from tail to head">↗</button>
    <button class="tool" data-tool="line" title="Line — drag">╲</button>
    <button class="tool" data-tool="freehand" title="Pen — draw freehand">✏</button>
    <button class="tool" data-tool="highlight" title="Highlighter — drag a box">🖍</button>
    <button class="tool" data-tool="text" title="Text note — click where it goes, type, Enter">T</button>
    <button class="tool" data-tool="callout" title="Callout — drag from the thing you're flagging to where the note goes">🏷</button>
    <span class="tb-sep" aria-hidden="true"></span>
    <button class="tool" data-tool="calibrate" title="Calibrate this sheet's scale — click two points a known distance apart, then enter the distance in feet. Measurements need this once per sheet.">📏</button>
    <button class="tool" data-tool="mlength" title="Measure length — click along the run, double-click or Enter to finish (Backspace removes the last point)">↔</button>
    <button class="tool" data-tool="marea" title="Measure area — click around the region, double-click or Enter to close">⬠</button>
    <button class="tool" data-tool="mcount" title="Count — click each item, double-click or Enter to finish and name the group">🔢</button>
    <input type="color" id="mkColor" value="#e05555" title="Markup color (applies to the selected markup too)">
    <select id="mkWidth" title="Line weight / text size (applies to the selected markup too)">
      <option value="S">Thin</option>
      <option value="M" selected>Medium</option>
      <option value="L">Thick</option>
    </select>
  </div>

  <div class="spacer"></div>

  <div class="tb-group">
    <button id="btnUndo" class="btn" title="Undo (Ctrl+Z)" disabled>↶</button>
    <button id="btnRedo" class="btn" title="Redo (Ctrl+Y)" disabled>↷</button>
    <button id="btnList" class="btn" title="Markup list — every markup across the set, click to jump">📋</button>
    <button id="btnPrevPage" class="btn" title="Previous sheet" disabled>◀</button>
    <span id="pageInfo" class="page-info">– / –</span>
    <button id="btnNextPage" class="btn" title="Next sheet" disabled>▶</button>
    <button id="btnFit" class="btn" title="Fit the sheet to the window" disabled>⤢ Fit</button>
    <button id="btnThumbs" class="btn" title="Show / hide the sheet strip">🗂</button>
  </div>
</header>

<main>
  <aside id="thumbRail" aria-label="Sheets"></aside>
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="dropHint"><span>Drop a PDF or image here, or click <b>Open Plans…</b></span></div>
    <textarea id="textOverlay" class="hidden" rows="2" spellcheck="false"
      placeholder="Type the note — Enter to place, Esc to cancel"></textarea>
  </div>
  <aside id="markupPanel" class="hidden" aria-label="Markup list">
    <div class="mk-head">
      <b>Markups</b>
      <label class="mk-sheet"><input type="checkbox" id="mkThisSheet"> this sheet</label>
      <select id="mkKindFilter" title="Filter by type">
        <option value="">All types</option>
        <option value="cloud">Clouds</option>
        <option value="rect">Rectangles</option>
        <option value="ellipse">Ellipses</option>
        <option value="arrow">Arrows</option>
        <option value="line">Lines</option>
        <option value="freehand">Pen</option>
        <option value="highlight">Highlights</option>
        <option value="text">Text</option>
        <option value="callout">Callouts</option>
        <option value="mlength">Lengths</option>
        <option value="marea">Areas</option>
        <option value="mcount">Counts</option>
      </select>
    </div>
    <div id="mkList" class="mk-list"></div>
  </aside>
</main>

<!-- generic ask-modal (engine-ui createModals shape) -->
<div id="modal" class="modal hidden" tabindex="-1">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalCancel" class="btn">Cancel</button>
      <button id="modalOk" class="btn primary">OK</button>
    </div>
  </div>
</div>

<!-- projects modal -->
<div id="projects" class="modal hidden">
  <div class="modal-box wide">
    <h3>Projects</h3>
    <div id="projList" class="proj-list"></div>
    <div class="modal-actions">
      <button id="btnProjNew" class="btn primary">+ New project</button>
      <span class="spacer"></span>
      <button id="projClose" class="btn">Close</button>
    </div>
  </div>
</div>

<script type="module" src="app.js?v=1"></script>
</body>
</html>
